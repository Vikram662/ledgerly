<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thekedaar · Add advance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0369A1}a:hover{color:#075985}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#fff;font-family:'Manrope',system-ui,sans-serif;color:#15181D;display:flex;flex-direction:column}
.scr button{font-family:inherit;cursor:pointer}
.muted{color:#5B6370}
.num{font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid #E3E6EA;background:#fff;display:flex;align-items:center;justify-content:center;color:#15181D;text-decoration:none}
.mode{height:40px;padding:0 14px;border-radius:20px;border:1px solid #E3E6EA;background:#fff;font-size:13px;font-weight:700;color:#3A414B;flex:none}
.mode.on{background:#15181D;border-color:#15181D;color:#fff}
.key{height:60px;border-radius:14px;border:0;background:#F4F5F7;font-size:26px;font-weight:700;color:#15181D;display:flex;align-items:center;justify-content:center}
.key:active{background:#E3E6EA}
</style>
</helmet>
<div class="scr">

<header style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 8px">
<a class="iconbtn" href="Khata.dc.html" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
<h1 style="margin: 0; font-size: 18px; font-weight: 800">Add advance</h1>
</header>

<div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 16px; flex: 1">
<button style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; border: 1px solid #E3E6EA; background: #fff; text-align: left">
<span style="width: 40px; height: 40px; border-radius: 20px; background: #E9ECEF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #3A414B">RK</span>
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 800">Raju Kumar</span><span class="muted num" style="display: block; font-size: 12px; font-weight: 600">Balance ₹8,600 to pay</span></span>
<span style="font-size: 13px; font-weight: 700; color: #0369A1">Change</span>
</button>

<div style="text-align: center; padding: 8px 0">
<div class="muted" style="font-size: 13px; font-weight: 700">Amount</div>
<div class="num" style="font-size: 48px; font-weight: 800; letter-spacing: -0.03em; color: {{amountColor}}">₹{{amountText}}</div>
<div class="muted num" style="font-size: 12px; font-weight: 600">New balance ₹{{newBalance}}</div>
</div>

<div style="display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="5"><button class="{{m.cls}}" onClick="{{m.pick}}" aria-pressed="{{m.on}}">{{m.label}}</button></sc-for>
</div>

<label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; background: #F4F5F7; color: #5B6370">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
<input placeholder="Note (optional)" aria-label="Note" style="flex: 1; border: 0; outline: 0; background: transparent; font: 600 14px Manrope, system-ui, sans-serif; color: #15181D">
<span style="font-size: 12px; font-weight: 700">Today</span>
</label>
</div>

<div style="padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; background: #fff">
<div class="num" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12"><button class="key" onClick="{{k.press}}" aria-label="{{k.aria}}">{{k.label}}</button></sc-for>
</div>
<button style="height: 56px; border-radius: 16px; border: 0; background: {{saveBg}}; color: {{saveFg}}; font-size: 16px; font-weight: 800">Save advance</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { amount: '2000', mode: 'Cash' };
}
fmt(n) {
return Number(n || 0).toLocaleString('en-IN');
}
renderVals() {
var self = this;
var amt = this.state.amount;
var modes = ['Cash', 'PhonePe', 'GPay', 'Paytm', 'Bank'].map(function (m) {
var on = self.state.mode === m;
return { label: m, on: on ? 'true' : 'false', cls: on ? 'mode on' : 'mode', pick: function () { self.setState({ mode: m }); } };
});
var labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', '⌫'];
var keys = labels.map(function (l) {
return {
label: l,
aria: l === '⌫' ? 'Delete' : l,
press: function () {
var a = self.state.amount;
if (l === '⌫') a = a.slice(0, -1);
else if (a.length < 7) a = (a === '' || a === '0') ? (l === '00' ? '' : l) : a + l;
self.setState({ amount: a });
}
};
});
var value = Number(amt || 0);
return {
amountText: this.fmt(value),
amountColor: value > 0 ? '#15181D' : '#C9CED6',
newBalance: this.fmt(8600 - value),
modes: modes,
keys: keys,
saveBg: value > 0 ? '#0369A1' : '#E3E6EA',
saveFg: value > 0 ? '#fff' : '#8A919C'
};
}
}
</script>
</body>
</html>
