<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledgerly · Who will use this app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0369A1}a:hover{color:#075985}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#fff;font-family:'Manrope',system-ui,sans-serif;color:#15181D;display:flex;flex-direction:column;padding:16px 20px 24px;gap:20px}
.scr button{font-family:inherit;cursor:pointer}
.muted{color:#5B6370}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid #E3E6EA;background:#fff;display:flex;align-items:center;justify-content:center;color:#15181D;text-decoration:none;flex:none}
.opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:#fff;text-align:left;width:100%}
.opt .t{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.radio{width:22px;height:22px;border-radius:11px;box-sizing:border-box;flex:none}
</style>
</helmet>
<div class="scr">

<header style="display: flex; align-items: center; gap: 12px">
<a class="iconbtn" href="Welcome.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></a>
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" aria-label="Step 1 of 3">
<span style="height: 6px; border-radius: 3px; background: #0369A1"></span><span style="height: 6px; border-radius: 3px; background: #E3E6EA"></span><span style="height: 6px; border-radius: 3px; background: #E3E6EA"></span>
</div>
<span class="muted" style="font-size: 12px; font-weight: 800">1 / 3</span>
</header>

<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Who will use this app?</h1>
<p class="muted" style="margin: 6px 0 0; font-size: 14px; font-weight: 600">We set up the tabs and lists for you.</p>
</div>

<div role="radiogroup" aria-label="User type" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{types}}" as="o" hint-placeholder-count="3">
<button class="opt" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="{{o.box}}">
<span class="t" style="{{o.iconBox}}">
<sc-if value="{{o.isC}}" hint-placeholder-val="{{ true }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17h18M5 17a7 7 0 0 1 14 0"/><path d="M10 10V6.5a2 2 0 0 1 4 0V10M4 20h16"/></svg></sc-if>
<sc-if value="{{o.isS}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9 5.5 4h13L20 9M4 9h16v11H4zM9 20v-6h6v6"/></svg></sc-if>
<sc-if value="{{o.isP}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></sc-if>
</span>
<span style="flex: 1; min-width: 0">
<span style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800">{{o.label}}<sc-if value="{{o.isP}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 8px; background: #ECFDF5; color: #047857">FREE</span></sc-if></span>
<span class="muted" style="display: block; font-size: 13px; font-weight: 600; margin-top: 2px">{{o.desc}}</span>
</span>
<span class="radio" style="{{o.radio}}"></span>
</button>
</sc-for>
</div>

<p class="muted" style="margin: 0; font-size: 12px; font-weight: 600">Contractor and Shopkeeper: ₹99/month after a 5-day free trial.</p>

<div style="flex: 1"></div>
<a href="{{nextHref}}" aria-disabled="{{disabled}}" style="height: 56px; border-radius: 16px; background: {{ctaBg}}; color: {{ctaFg}}; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Continue</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { type: 'contractor' };
}
renderVals() {
var self = this;
var list = [
{ id: 'contractor', label: 'Contractor', desc: 'Workers, sites, attendance and bills' },
{ id: 'shop', label: 'Shopkeeper', desc: 'Cloth, kirana, medical or any shop' },
{ id: 'personal', label: 'Personal', desc: 'Salary, home expenses and savings' }
];
var types = list.map(function (o) {
var on = self.state.type === o.id;
return {
label: o.label, desc: o.desc,
isC: o.id === 'contractor', isS: o.id === 'shop', isP: o.id === 'personal',
on: on ? 'true' : 'false',
box: on ? 'border: 2px solid #0369A1; background: #F0F9FF' : 'border: 1px solid #E3E6EA; margin: 1px',
iconBox: on ? 'background: #0369A1; color: #fff' : 'background: #F4F5F7; color: #15181D',
radio: on ? 'border: 7px solid #0369A1; background: #fff' : 'border: 2px solid #C9CED6',
pick: function () { self.setState({ type: o.id }); }
};
});
var has = !!this.state.type;
return {
types: types,
nextHref: has ? 'OnbBusiness.dc.html' : '#',
disabled: has ? 'false' : 'true',
ctaBg: has ? '#0369A1' : '#E3E6EA',
ctaFg: has ? '#fff' : '#8A919C'
};
}
}
</script>
</body>
</html>
