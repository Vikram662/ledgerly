<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thekedaar · Calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}a{color:#0369A1}a:hover{color:#075985}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#F4F5F7;font-family:'Manrope',system-ui,sans-serif;color:#15181D;display:flex;flex-direction:column}
.scr button{font-family:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.top h1{margin:0;flex:1;font-size:20px;font-weight:800}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid #E3E6EA;background:#fff;display:flex;align-items:center;justify-content:center;color:#15181D;text-decoration:none;flex:none}
.body{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid #E3E6EA;border-radius:16px}
.t1{font-size:15px;font-weight:700}.t2{font-size:12px;font-weight:600;color:#5B6370}
.num{font-variant-numeric:tabular-nums}
.g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.d{height:46px;border-radius:10px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:700;color:#15181D;padding:0}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:3px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px}
.row+.row{border-top:1px solid #EEF0F2}
.tag{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
</style>
</helmet>
<div class="scr">
<header class="top">
<a class="ib" href="More.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></a>
<h1>Calendar</h1>
<button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #E3E6EA; background: #fff; font-size: 13px; font-weight: 800">Today</button>
</header>
<div class="body">
<section class="card" style="padding: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px 10px">
<button class="ib" style="width: 36px; height: 36px; border: 0; background: #F4F5F7" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
<b style="font-size: 15px">October 2026</b>
<button class="ib" style="width: 36px; height: 36px; border: 0; background: #F4F5F7" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
</div>
<div class="g t2" style="text-align: center; font-weight: 800; font-size: 11px; margin-bottom: 4px"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
<div class="g num">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35"><button class="d" style="{{c.style}}" aria-label="{{c.aria}}">{{c.n}}<span class="dots"><sc-for list="{{c.dots}}" as="x" hint-placeholder-count="2"><i style="background: {{x}}"></i></sc-for></span></button></sc-for>
</div>
<div class="t2" style="display: flex; gap: 12px; justify-content: center; padding-top: 10px; font-weight: 700; font-size: 11px">
<span><i style="display: inline-block; width: 7px; height: 7px; border-radius: 4px; background: #059669"></i> Money in</span>
<span><i style="display: inline-block; width: 7px; height: 7px; border-radius: 4px; background: #E11D48"></i> Money out</span>
<span><i style="display: inline-block; width: 7px; height: 7px; border-radius: 4px; background: #0369A1"></i> Bill / quote</span>
<span><i style="display: inline-block; width: 7px; height: 7px; border-radius: 4px; background: #F59E0B"></i> Holiday</span>
</div>
</section>

<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px"><b style="font-size: 16px">Fri, 17 Oct</b><span class="t2 num">Present 12 · Half 1 · Absent 1</span></div>
<div class="card num">
<div class="row"><span class="tag" style="background: #ECFDF5; color: #047857">In</span><div style="flex: 1"><div class="t1">Payment · [Client]</div><div class="t2">PhonePe · Bill #42</div></div><b style="color: #047857">₹20,800</b></div>
<div class="row"><span class="tag" style="background: #FFF1F2; color: #BE123C">Out</span><div style="flex: 1"><div class="t1">Expense · Material</div><div class="t2">20 bags cement</div></div><b style="color: #BE123C">₹1,900</b></div>
<div class="row"><span class="tag" style="background: #FFFBEB; color: #B45309">Adv</span><div style="flex: 1"><div class="t1">Advance · Raju Kumar</div><div class="t2">Cash</div></div><b>₹2,000</b></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var G = '#059669', R = '#E11D48', B = '#0369A1', A = '#F59E0B';
var marks = { 2: [B], 3: [G], 6: [R], 9: [G, R], 10: [R], 12: [A], 15: [R], 16: [B, R], 17: [G, R] };
var cells = [];
for (var i = 0; i < 3; i++) cells.push({ n: '', dots: [], style: 'cursor: default', aria: 'Empty' });
for (var d = 1; d <= 31; d++) {
var style = '';
if (d === 17) style = 'background: #15181D; color: #fff';
else if (d === 12) style = 'background: #FFFBEB; color: #92400E';
else if (d > 17) style = 'color: #8A919C';
cells.push({ n: String(d), dots: marks[d] || [], style: style, aria: d + ' October' });
}
cells.push({ n: '', dots: [], style: 'cursor: default', aria: 'Empty' });
return { cells: cells };
}
}
</script>
</body>
</html>
