<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thekedaar · Business and trades</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0369A1}a:hover{color:#075985}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#fff;font-family:'Manrope',system-ui,sans-serif;color:#15181D;display:flex;flex-direction:column}
.scr button{font-family:inherit;cursor:pointer}
.muted{color:#5B6370}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid #E3E6EA;background:#fff;display:flex;align-items:center;justify-content:center;color:#15181D;text-decoration:none;flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:13px;font-weight:700;color:#3A414B}
.inp{height:52px;border-radius:14px;border:1px solid #C9CED6;padding:0 14px;display:flex;align-items:center;gap:8px;background:#fff}
.inp input{flex:1;border:0;outline:0;background:transparent;font:700 16px Manrope,system-ui,sans-serif;color:#15181D;min-width:0}
.trade{height:48px;border-radius:14px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;font-weight:700;text-align:left}
.box{width:20px;height:20px;border-radius:6px;box-sizing:border-box;flex:none;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="scr">

<div style="flex: 1; overflow-y: auto; padding: 16px 20px 16px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; align-items: center; gap: 12px">
<a class="iconbtn" href="OnbType.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></a>
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" aria-label="Step 2 of 3">
<span style="height: 6px; border-radius: 3px; background: #0369A1"></span><span style="height: 6px; border-radius: 3px; background: #0369A1"></span><span style="height: 6px; border-radius: 3px; background: #E3E6EA"></span>
</div>
<span class="muted" style="font-size: 12px; font-weight: 800">2 / 3</span>
</header>

<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">About your business</h1>
<p class="muted" style="margin: 6px 0 0; font-size: 14px; font-weight: 600">Shown on your bills and pay slips.</p>
</div>

<label class="field"><span>Business name</span><span class="inp"><input value="" placeholder="e.g. Sharma Electricals" aria-label="Business name"></span></label>
<label class="field"><span>Mobile number <span class="muted" style="font-weight: 600">(optional)</span></span><span class="inp"><b style="font-size: 16px; color: #5B6370; padding-right: 8px; border-right: 1px solid #E3E6EA">+91</b><input inputmode="numeric" placeholder="10-digit number" aria-label="Mobile number"></span></label>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 17px; font-weight: 800">What work do you do?</h2>
<span style="font-size: 12px; font-weight: 800; color: #0369A1">{{count}} selected</span>
</div>
<p class="muted" style="margin: -4px 0 0; font-size: 13px; font-weight: 600">Choose one or more. Fills worker roles, units and rate list.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{trades}}" as="t" hint-placeholder-count="10">
<button class="trade" role="checkbox" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="{{t.btn}}"><span class="box" style="{{t.box}}"><sc-if value="{{t.sel}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></sc-if></span>{{t.label}}</button>
</sc-for>
</div>
</div>
</div>

<div style="padding: 12px 20px 24px; border-top: 1px solid #EEF0F2; background: #fff">
<a href="{{nextHref}}" aria-disabled="{{disabled}}" style="height: 56px; border-radius: 16px; background: {{ctaBg}}; color: {{ctaFg}}; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Continue</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: { electrical: true, civil: true } };
}
renderVals() {
var self = this;
var all = [
['electrical', 'Electrical'], ['plumbing', 'Plumbing'], ['civil', 'Civil / Construction'], ['painting', 'Painting'],
['tiles', 'Tiles / Flooring'], ['carpentry', 'Carpentry / Interior'], ['pop', 'POP / False Ceiling'], ['fabrication', 'Fabrication / Welding'],
['labour', 'Labour Supply'], ['other', 'Other']
];
var picked = this.state.picked;
var count = 0;
var trades = all.map(function (t) {
var on = !!picked[t[0]];
if (on) count++;
return {
label: t[1], sel: on, on: on ? 'true' : 'false',
btn: on ? 'border: 2px solid #0369A1; background: #F0F9FF; color: #15181D' : 'border: 1px solid #E3E6EA; margin: 1px; background: #fff; color: #15181D',
box: on ? 'background: #0369A1' : 'border: 2px solid #C9CED6',
pick: function () {
var next = Object.assign({}, self.state.picked);
next[t[0]] = !next[t[0]];
self.setState({ picked: next });
}
};
});
var ok = count > 0;
return {
trades: trades, count: count,
nextHref: ok ? 'PinCreate.dc.html' : '#',
disabled: ok ? 'false' : 'true',
ctaBg: ok ? '#0369A1' : '#E3E6EA',
ctaFg: ok ? '#fff' : '#8A919C'
};
}
}
</script>
</body>
</html>
