<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledgerly · Month register</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}a{color:#0369A1}a:hover{color:#075985}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#F4F5F7;font-family:'Manrope',system-ui,sans-serif;color:#15181D;display:flex;flex-direction:column}
.scr button{font-family:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.top h1{margin:0;flex:1;font-size:20px;font-weight:800}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid #E3E6EA;background:#fff;display:flex;align-items:center;justify-content:center;color:#15181D;text-decoration:none;flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:4px;background:#E9ECEF;border-radius:12px}
.seg button{height:36px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:700;color:#5B6370}
.seg button.on{background:#fff;color:#15181D;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.card{background:#fff;border:1px solid #E3E6EA;border-radius:16px}
.t2{font-size:12px;font-weight:600;color:#5B6370}
.num{font-variant-numeric:tabular-nums}
.tbl{display:flex;flex-direction:column}
.tr{display:flex;align-items:center;border-top:1px solid #EEF0F2}
.nm{width:96px;flex:none;padding:0 10px;font-size:13px;font-weight:700;position:sticky;left:0;background:#fff;height:40px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid #EEF0F2}
.c{width:26px;height:26px;margin:7px 2px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.tot{width:44px;flex:none;text-align:center;font-size:13px;font-weight:800}
</style>
</helmet>
<div class="scr">
<header class="top">
<a class="ib" href="Attendance.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></a>
<h1>Attendance</h1>
<button class="ib" aria-label="Share register PDF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
</header>
<div style="padding: 0 16px 12px; display: flex; flex-direction: column; gap: 12px">
<div class="seg" role="tablist" aria-label="View"><button role="tab" aria-selected="false">Mark today</button><button class="on" role="tab" aria-selected="true">Month register</button></div>
<div class="card" style="display: flex; align-items: center; justify-content: space-between; padding: 4px">
<button class="ib" style="border: 0" aria-label="Previous month"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
<b style="font-size: 16px">October 2026</b>
<button class="ib" style="border: 0" aria-label="Next month"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
</div>
</div>
<div class="card" style="margin: 0 16px; overflow-x: auto; flex: 1; overflow-y: auto">
<div class="tbl num" style="width: max-content">
<div class="tr" style="border-top: 0"><span class="nm t2" style="font-weight: 800">Worker</span><sc-for list="{{days}}" as="d" hint-placeholder-count="17"><span class="c t2" style="font-weight: 800; color: {{d.color}}">{{d.n}}</span></sc-for><span class="tot t2">Days</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div class="tr"><span class="nm">{{r.name}}<span class="t2" style="font-size: 11px">{{r.role}}</span></span><sc-for list="{{r.cells}}" as="c" hint-placeholder-count="17"><span class="c" style="{{c.style}}">{{c.t}}</span></sc-for><span class="tot">{{r.total}}</span></div>
</sc-for>
</div>
</div>
<div class="t2" style="display: flex; gap: 12px; justify-content: center; padding: 12px 16px 20px; font-weight: 700">
<span style="display: flex; gap: 5px; align-items: center"><span class="c" style="margin: 0; width: 16px; height: 16px; background: #ECFDF5"></span>Present</span>
<span style="display: flex; gap: 5px; align-items: center"><span class="c" style="margin: 0; width: 16px; height: 16px; background: #FFFBEB"></span>Half</span>
<span style="display: flex; gap: 5px; align-items: center"><span class="c" style="margin: 0; width: 16px; height: 16px; background: #FFF1F2"></span>Absent</span>
<span style="display: flex; gap: 5px; align-items: center"><span class="c" style="margin: 0; width: 16px; height: 16px; background: #EEF0F2"></span>Off</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var st = {
P: 'background: #ECFDF5; color: #047857',
H: 'background: #FFFBEB; color: #B45309',
A: 'background: #FFF1F2; color: #BE123C',
O: 'background: #EEF0F2; color: #8A919C'
};
var label = { P: 'P', H: '½', A: 'A', O: '' };
var people = [
['Raju K.', 'Helper', 'PPPOPPPHPPOPAPPHP'],
['Suresh M.', 'Mistri', 'PPPOPPPPPPOPPPPPP'],
['Anil V.', 'Helper', 'PAPOPPHPPPOPPAPPH'],
['Mohan D.', 'Electr.', 'PPPOPAPPPPOPPPPPA'],
['Vikas K.', 'Helper', 'PPHOPPPPAPOPPPPPP'],
['Pappu S.', 'Helper', 'PPPOPPPPPPOPPPPPP']
];
var rows = people.map(function (p) {
var total = 0;
var cells = p[2].split('').map(function (m) {
if (m === 'P') total += 1;
if (m === 'H') total += 0.5;
return { t: label[m], style: st[m] };
});
return { name: p[0], role: p[1], cells: cells, total: String(total) };
});
var days = [];
for (var d = 1; d <= 17; d++) days.push({ n: String(d), color: (d === 4 || d === 11) ? '#BE123C' : '#5B6370' });
return { rows: rows, days: days };
}
}
</script>
</body>
</html>
