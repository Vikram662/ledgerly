<style>
body{margin:0}a{color:#0369A1}a:hover{color:#075985}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#fff;font-family:'Manrope',system-ui,sans-serif;color:#15181D;display:flex;flex-direction:column}
.scr button{font-family:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.top h1{margin:0;flex:1;font-size:20px;font-weight:800}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid #E3E6EA;background:#fff;display:flex;align-items:center;justify-content:center;color:#15181D;text-decoration:none;flex:none}
.body{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:16px}
.inp{min-height:52px;border-radius:14px;border:1px solid #C9CED6;padding:0 14px;display:flex;align-items:center;gap:8px;background:#fff;box-sizing:border-box}
.inp input{flex:1;border:0;outline:0;background:transparent;font:700 16px Manrope,system-ui,sans-serif;color:#15181D;min-width:0}
.fld{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.fld>span{font-size:13px;font-weight:700;color:#3A414B}
.opt{color:#5B6370;font-weight:600}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid #E3E6EA;background:#fff;font-size:13px;font-weight:700;color:#3A414B;flex:none}
.chip.on{background:#15181D;border-color:#15181D;color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:4px;background:#E9ECEF;border-radius:12px}
.seg button{height:38px;border:0;border-radius:9px;background:transparent;font-size:13px;font-weight:700;color:#5B6370}
.seg button.on{background:#fff;color:#15181D;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.sec{margin:6px 0 -4px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#5B6370}
.foot{padding:12px 16px 20px;background:#fff;border-top:1px solid #E3E6EA}
.bp{height:56px;border-radius:16px;background:#0369A1;color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none}
</style>

<div class="scr">
<header class="top">
<a class="ib" href="Workers.dc.html" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
<h1>Add worker</h1>
</header>
<div class="body">
<div style="display: flex; align-items: center; gap: 14px">
<button aria-label="Add photo" style="width: 72px; height: 72px; border-radius: 24px; border: 1.5px dashed #9AA3AE; background: #F4F5F7; color: #5B6370; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
<label class="fld"><span>Name</span><span class="inp"><input placeholder="Worker name" aria-label="Name"></span></label>
</div>
<label class="fld"><span>Mobile number <span class="opt">(optional)</span></span><span class="inp"><b style="color: #5B6370; padding-right: 8px; border-right: 1px solid #E3E6EA">+91</b><input inputmode="numeric" placeholder="10-digit number" aria-label="Mobile number"></span></label>
<div class="fld"><span>Role</span><div style="display: flex; gap: 8px; flex-wrap: wrap"><button class="chip on">Helper</button><button class="chip">Electrician</button><button class="chip">Wireman</button><button class="chip">+ New role</button></div></div>

<h2 class="sec">Wage</h2>
<div class="seg" role="tablist" aria-label="Wage type"><button class="on" role="tab" aria-selected="true">Daily</button><button role="tab" aria-selected="false">Monthly</button><button role="tab" aria-selected="false">Piece-rate</button></div>
<div style="display: flex; gap: 8px">
<label class="fld"><span>Rate per day</span><span class="inp"><b style="color: #5B6370">₹</b><input value="600" aria-label="Rate per day"></span></label>
<label class="fld"><span>OT per hour <span class="opt">(opt.)</span></span><span class="inp"><b style="color: #5B6370">₹</b><input value="80" aria-label="OT rate per hour"></span></label>
</div>
<div style="display: flex; gap: 8px">
<label class="fld"><span>Joining date</span><span class="inp"><input value="17 Oct 2026" aria-label="Joining date"></span></label>
<label class="fld"><span>UPI ID <span class="opt">(opt.)</span></span><span class="inp"><input placeholder="name@okaxis" aria-label="UPI ID"></span></label>
</div>
</div>

</div>
