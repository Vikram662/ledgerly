<h1>Work rules</h1>

<p class="t2">On this day "Mark all" marks Off. Weekly off is paid for monthly workers, unpaid for daily workers.</p>
</section>
<section class="card">
<h2 class="h">Monthly salary → per-day rate</h2>
<div role="radiogroup" aria-label="Per-day rate" style="display: flex; flex-direction: column; gap: 8px">
<button class="r on" role="radio" aria-checked="true"><span class="dot"></span>Salary ÷ days in month</button>
<button class="r" role="radio" aria-checked="false"><span class="dot"></span>Salary ÷ 30</button>
<button class="r" role="radio" aria-checked="false"><span class="dot"></span>Salary ÷ 26</button>
</div>
<p class="t2">Used for new monthly workers. Each worker can be changed from their wage screen.</p>
</section>
