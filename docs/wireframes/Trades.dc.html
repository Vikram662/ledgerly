<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thekedaar · Trades</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}a{color:#0369A1}a:hover{color:#075985}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#fff;font-family:'Manrope',system-ui,sans-serif;color:#15181D;display:flex;flex-direction:column}
.scr button{font-family:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.top h1{margin:0;flex:1;font-size:20px;font-weight:800}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid #E3E6EA;background:#fff;display:flex;align-items:center;justify-content:center;color:#15181D;text-decoration:none;flex:none}
.body{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:14px}
.t2{font-size:13px;font-weight:600;color:#5B6370;margin:0;line-height:1.45}
.trade{height:52px;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:13px;font-weight:700;text-align:left;border:1px solid #E3E6EA;margin:1px;background:#fff;color:#15181D}
.trade.on{border:2px solid #0369A1;background:#F0F9FF;margin:0}
.box{width:20px;height:20px;border-radius:6px;box-sizing:border-box;flex:none;border:2px solid #C9CED6;display:flex;align-items:center;justify-content:center}
.trade.on .box{background:#0369A1;border:0}
.foot{padding:12px 16px 20px;background:#fff;border-top:1px solid #E3E6EA}
.bp{height:56px;border-radius:16px;background:#0369A1;color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none}
</style>
</helmet>
<div class="scr">
<header class="top">
<a class="ib" href="Settings.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></a>
<h1>Trades</h1>
</header>
<div class="body">
<p class="t2">Adding a trade adds its roles, items and templates. Removing one keeps all your data.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{trades}}" as="t" hint-placeholder-count="10">
<button class="{{t.cls}}" role="checkbox" aria-checked="{{t.on}}"><span class="box"><sc-if value="{{t.sel}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></sc-if></span>{{t.label}}</button>
</sc-for>
</div>
</div>
<div class="foot"><a class="bp" href="Settings.dc.html">Save</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var picked = { 'Electrical': true, 'Civil / Construction': true };
var trades = ['Electrical', 'Plumbing', 'Civil / Construction', 'Painting', 'Tiles / Flooring', 'Carpentry / Interior', 'POP / False Ceiling', 'Fabrication / Welding', 'Labour Supply', 'Other'].map(function (l) {
var on = !!picked[l];
return { label: l, sel: on, on: on ? 'true' : 'false', cls: on ? 'trade on' : 'trade' };
});
return { trades: trades };
}
}
</script>
</body>
</html>
