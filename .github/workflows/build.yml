name: Build

on:
  push:
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Release signing is used only when these secrets exist (docs/RELEASE.md).
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Keep CI reproducible. pubspec.lock is generated for this SDK;
          # an unpinned stable channel can change underneath a working build.
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install SQLite (for database tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # android/ is not committed yet; generate it (existing files are never overwritten).
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.ledgerly --project-name app

      - name: Set up Firebase Android
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Patch Android project (biometric, permissions, minSdk)
        run: dart run tool/patch_android.dart

      # Never committed: written fresh from secrets on every run.
      - name: Set up release signing
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.p12
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.p12
          EOF
          # SHA-1 is not secret; it is needed for the Google OAuth client (D-7).
          sha1=$(keytool -list -v -keystore android/app/upload-keystore.p12 \
            -storepass "$KEYSTORE_PASSWORD" | grep -m1 'SHA1:' | awk '{print $2}')
          echo "::notice title=Release key SHA-1::$sha1"

      - run: flutter pub get

      - name: Generate app icon
        run: bash tool/ci_annotate.sh "App icon" "error|Error|Exception|SEVERE|Unable|Failed" dart run flutter_launcher_icons

      - name: Generate splash screen
        run: |
          bash tool/ci_annotate.sh "Splash" "error|Error|Exception|SEVERE|Unable|Failed" dart run flutter_native_splash:create
          # the splash tool rewrites styles; re-apply the AppCompat themes
          dart run tool/patch_android.dart

      - name: Generate code (drift)
        run: bash tool/ci_annotate.sh "Codegen" "error|Error|SEVERE" dart run build_runner build --delete-conflicting-outputs

      # Errors are also written as annotations so they can be read without
      # opening the full log (tool/ci_annotate.sh).
      - name: Analyze
        run: bash tool/ci_annotate.sh "Analyze" "^ *error " flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: bash tool/ci_annotate.sh "Test" "Error|error:|\[E\]|Expected|Actual|Which:" flutter test --reporter expanded

      # Google Drive backup needs the Web OAuth client id (PRD D-7). Add it as a
      # repository secret named GOOGLE_SERVER_CLIENT_ID; the app builds without it.
      - name: Validate Firebase Android identity
        if: env.HAS_FIREBASE == "true"
        run: |
          firebase_app_id=$(jq -r ".client[] | select(.client_info.android_client_info.package_name == \"com.ledgerly.app\") | .client_info.mobilesdk_app_id" android/app/google-services.json)
          if [ -z "$firebase_app_id" ] || [ "$firebase_app_id" = "null" ]; then
            echo "::error title=Firebase package mismatch::GOOGLE_SERVICES_JSON_BASE64 must contain the com.ledgerly.app Android client."
            exit 1
          fi
          if ! grep -Fq "$firebase_app_id" lib/firebase_options.dart; then
            echo "::error title=Firebase app ID mismatch::Update lib/firebase_options.dart from the new com.ledgerly.app Firebase client."
            exit 1
          fi

      - name: Build debug APK
        run: bash tool/ci_annotate.sh "Build" "error|Error|FAILURE|What went wrong" flutter build apk --debug --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }} --dart-define=SUBSCRIPTION_API_URL=${{ secrets.SUBSCRIPTION_API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: ledgerly-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # One small APK per CPU type; most phones need arm64-v8a.
      - name: Build release APKs
        run: bash tool/ci_annotate.sh "Release APK" "error|Error|FAILURE|What went wrong" flutter build apk --release --split-per-abi --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }} --dart-define=SUBSCRIPTION_API_URL=${{ secrets.SUBSCRIPTION_API_URL }}

      # App bundle for the Play Store.
      - name: Build release app bundle
        run: bash tool/ci_annotate.sh "Release AAB" "error|Error|FAILURE|What went wrong" flutter build appbundle --release --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }} --dart-define=SUBSCRIPTION_API_URL=${{ secrets.SUBSCRIPTION_API_URL }}

      - name: Warn if release is debug-signed
        if: env.HAS_SIGNING != 'true'
        run: echo "::warning title=Release signing::Signing secrets not set, so release files are signed with the debug key. Do not upload them to the Play Store."

      - uses: actions/upload-artifact@v4
        with:
          name: ledgerly-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ledgerly-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
